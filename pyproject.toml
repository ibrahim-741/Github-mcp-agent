version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohammed Ibrahim", email = "ibrahimfarry7412003@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain-core>=1.7.0",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
